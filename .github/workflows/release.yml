name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0). If left empty, automatically determined from app/build.gradle.kts'
        required: false
        type: string
      release_notes:
        description: 'Custom release notes / description (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Release Keystore (if secret provided)
        id: setup-keystore
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_PATH="${{ runner.temp }}/release.jks"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${RELEASE_STORE_PASSWORD:-}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-${RELEASE_STORE_PASSWORD:-}}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${RELEASE_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "Release keystore configured from secrets."
          else
            echo "No custom release keystore secret found; using debug keystore for signing."
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Resolve Release Tag
        id: resolve-tag
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            if [[ "$INPUT_VERSION" != v* ]]; then
              TAG="v${INPUT_VERSION}"
            else
              TAG="$INPUT_VERSION"
            fi
          else
            BASE_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
            if [ -z "$BASE_VERSION" ]; then
              BASE_VERSION="1.0.0"
            fi
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            
            while git rev-parse "$TAG" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            done
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ env.RELEASE_TAG }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Package Distributable APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK at $APK_FILE"
          cp "$APK_FILE" "dist/gh-development-dashboard-${{ env.RELEASE_TAG }}.apk"
          cp "$APK_FILE" "dist/gh-development-dashboard.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh-development-dashboard-${{ env.RELEASE_TAG }}
          path: dist/*.apk
          retention-days: 30

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.RELEASE_TAG }}" -m "Release ${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GitHub Development Dashboard ${{ env.RELEASE_TAG }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ${{ inputs.release_notes }}

            ### 📱 Download & Install Android APK
            You can download and install the application directly on your Android device:

            1. Download the APK file below: **[`gh-development-dashboard-${{ env.RELEASE_TAG }}.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/gh-development-dashboard-${{ env.RELEASE_TAG }}.apk)**
            2. Open the downloaded `.apk` file on your device.
            3. If prompted, enable **"Install unknown apps"** for your browser or file manager.
            4. Tap **Install** and launch the app!
